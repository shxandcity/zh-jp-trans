<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中日雙標音助手</title>
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #1c1c1e; }
        .app-container { width: 100%; max-width: 500px; margin: auto; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 100px; border: 1px solid #d1d1d6; border-radius: 12px; padding: 12px; font-size: 17px; box-sizing: border-box; outline: none; resize: none; width: 100%; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; border-radius: 12px; padding: 16px; font-size: 18px; font-weight: 600; margin-top: 12px; cursor: pointer; }
        .result-box { background: white; border-radius: 18px; padding: 20px; margin-top: 15px; border: 1px solid #e5e5ea; }
        .section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #f2f2f7; }
        .section:last-child { border-bottom: none; margin-bottom: 0; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .label { font-size: 12px; color: var(--primary); font-weight: 600; text-transform: uppercase; }
        .btn-speak { background: #f2f2f7; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .text-content { font-size: 19px; line-height: 1.4; font-weight: 500; word-break: break-all; }
        .pronun-content { font-size: 14px; color: #ff3b30; margin-top: 6px; line-height: 1.3; word-break: break-all; min-height: 18px; font-weight: bold; }
        .loading { text-align: center; color: #8e8e93; display: none; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <h2 style="text-align:center; margin: 0 0 15px 0;">中日翻譯朗讀</h2>
        <textarea id="input" placeholder="輸入中文或日文..."></textarea>
        <button class="btn-main" onclick="handleProcess()">立即翻譯 & 標音</button>
        <div id="loading" class="loading">正在聯繫標音伺服器...</div>
    </div>

    <div id="resultArea" style="display:none">
        <div class="result-box">
            <div class="section">
                <div class="header-row"><span class="label">原文</span><button class="btn-speak" onclick="speak('orig')">🔊</button></div>
                <div id="origText" class="text-content"></div>
                <div id="origPronun" class="pronun-content"></div>
            </div>
            <div class="section">
                <div class="header-row"><span class="label">譯文</span><button class="btn-speak" onclick="speak('trans')">🔊</button></div>
                <div id="transText" class="text-content"></div>
                <div id="transPronun" class="pronun-content"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const KANA = {"kya":"きゃ","kyu":"きゅ","kyo":"きょ","sha":"しゃ","shu":"しゅ","sho":"しょ","cha":"ちゃ","chu":"ちゅ","cho":"ちょ","nya":"にゃ","nyu":"にゅ","nyo":"にょ","hya":"ひゃ","hyu":"ひゅ","hyo":"ひょ","mya":"みゃ","myu":"みゅ","myo":"みょ","rya":"りゃ","ryu":"りゃ","ryo":"りょ","gya":"ぎゃ","gyu":"ぎゅ","gyo":"ぎょ","ja":"じゃ","ju":"じゅ","jo":"じょ","bya":"びゃ","byu":"びゅ","byo":"びょ","pya":"ぴゃ","pyu":"ぴゅ","pyo":"ぴょ","ti":"てぃ","di":"でぃ","tu":"とぅ","ka":"か","ki":"き","ku":"く","ke":"け","ko":"こ","sa":"さ","shi":"し","su":"す","se":"せ","so":"そ","ta":"た","chi":"ち","tsu":"つ","te":"て","to":"と","na":"な","ni":"に","nu":"ぬ","ne":"ね","no":"の","ha":"は","hi":"ひ","fu":"ふ","he":"へ","ho":"ほ","ma":"ま","mi":"み","mu":"む","me":"め","mo":"も","ya":"や","yu":"ゆ","yo":"よ","ra":"ら","ri":"り","ru":"る","re":"れ","ro":"ろ","wa":"わ","wo":"を","ga":"が","gi":"ぎ","gu":"ぐ","ge":"げ","go":"ご","za":"ざ","ji":"じ","zu":"ず","ze":"ぜ","zo":"ぞ","da":"だ","di":"ぢ","du":"づ","de":"で","do":"ど","ba":"ば","bi":"び","bu":"ぶ","be":"べ","bo":"ぼ","pa":"ぱ","pi":"ぴ","pu":"ぷ","pe":"ぺ","po":"ぽ","a":"あ","i":"い","u":"う","e":"え","o":"お","n":"ん"};

    const FIX_LIST = [{r: "komekoku", c: "beikoku"}, {r: "kome koku", c: "beikoku"}];

    let sessionData = { oText: "", tText: "", sl: "", tl: "" };

    function toKana(str) {
        if (!str) return "";
        let res = str.toLowerCase();
        FIX_LIST.forEach(f => { res = res.split(f.r).join(f.c); });
        res = res.replace(/ō/g, 'ou').replace(/ū/g, 'uu').replace(/ā/g, 'aa').replace(/ī/g, 'ii').replace(/ē/g, 'ei');
        res = res.replace(/([bcdfghjklmpqrstvwxyz])\1/g, 'っ$1');
        const keys = Object.keys(KANA).sort((a,b) => b.length - a.length);
        keys.forEach(k => { res = res.split(k).join(KANA[k]); });
        return res.replace(/[a-z0-9\-]/g, '').replace(/\s+/g, '').trim();
    }

    // 暴力掃描 API 資料結構
    function findRomaji(data) {
        try {
            if (!data || !data[0]) return "";
            for (let row of data[0]) {
                if (row.length >= 4 && row[3]) return row[3]; // 羅馬字通常在這裡
                if (row.length >= 3 && row[2] && !row[0]) return row[2]; // 或是這裡
            }
        } catch(e) {}
        return "";
    }

    async function handleProcess() {
        const val = document.getElementById('input').value.trim();
        if(!val) return;
        
        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultArea').style.display = 'none';

        const isJp = /[\u3040-\u30ff]/.test(val);
        const sl = isJp ? 'ja' : 'zh-CN';
        const tl = isJp ? 'zh-CN' : 'ja';

        try {
            // 原文翻譯 & 原文標音
            const r1 = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&dt=rm&q=${encodeURIComponent(val)}`);
            const d1 = await r1.json();
            
            let translated = "";
            d1[0].forEach(s => { if(s[0]) translated += s[0] });
            
            let origP = findRomaji(d1);
            if (sl === 'ja') origP = toKana(origP);

            // 譯文標音（反向請求）
            const r2 = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${tl}&tl=${sl}&dt=rm&q=${encodeURIComponent(translated)}`);
            const d2 = await r2.json();
            let transP = findRomaji(d2);
            if (tl === 'ja') transP = toKana(transP);

            // 更新 UI
            sessionData = { oText: val, tText: translated, sl, tl };
            document.getElementById('origText').innerText = val;
            document.getElementById('origPronun').innerText = origP;
            document.getElementById('transText').innerText = translated;
            document.getElementById('transPronun').innerText = transP;
            document.getElementById('resultArea').style.display = 'block';

        } catch (e) {
            alert("服務繁忙，標音功能暫時失效");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function speak(type) {
        const text = type === 'orig' ? sessionData.oText : sessionData.tText;
        const lang = type === 'orig' ? sessionData.sl : sessionData.tl;
        if (!text) return;
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(text);
        m.lang = lang === 'ja' ? 'ja-JP' : 'zh-CN';
        window.speechSynthesis.speak(m);
    }
</script>
</body>
</html>
