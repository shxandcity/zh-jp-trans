<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業級中日翻譯標音助手</title>
    <script src="https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js"></script>
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px 20px 100px 20px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 600px; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; border: 1px solid #d1d1d6; border-radius: 12px; padding: 12px; font-size: 16px; box-sizing: border-box; outline: none; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; border-radius: 12px; padding: 15px; font-size: 17px; font-weight: 600; margin-top: 15px; cursor: pointer; }
        .btn-main:disabled { background: #ccc; }
        
        /* 修正換行問題 */
        .box { 
            background: #fff; 
            padding: 20px; 
            border-radius: 15px; 
            margin-top: 15px; 
            border: 1px solid #e5e5ea;
            word-wrap: break-word;      /* 舊版換行 */
            overflow-wrap: break-word;  /* 標準換行 */
            word-break: break-word;     /* 針對日文特別有效 */
            line-height: 2.2;           /* 為標音預留垂直空間 */
        }
        
        /* 標音樣式優化 */
        ruby { font-size: 22px; color: #1c1c1e; ruby-position: over; }
        rt { color: #ff3b30; font-size: 11px; font-weight: 500; }
        
        .status { font-size: 12px; color: #8e8e93; text-align: center; margin-top: 5px; }
        .ad-sticky-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid #ddd; padding: 10px 0; text-align: center; z-index: 100; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <h2 style="text-align:center">精確標音翻譯器</h2>
        <textarea id="input" placeholder="輸入中文或日文長句子..."></textarea>
        <button id="mainBtn" class="btn-main" onclick="processAll()" disabled>正在載入標音引擎...</button>
        <div id="status" class="status">準備中...</div>
    </div>

    <div id="resultArea" style="display:none">
        <div class="box" id="origOut"></div>
        <div class="box" id="transOut"></div>
    </div>
</div>

<div class="ad-sticky-bottom">
    <div style="color:#ccc; font-size:12px;">ADVERTISEMENT<br>贊助商廣告</div>
</div>

<script>
    const kuroshiro = new Kuroshiro();
    const analyzer = new KuromojiAnalyzer({ dictPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict" });
    let isReady = false;

    // 初始化引擎
    (async () => {
        try {
            await kuroshiro.init(analyzer);
            isReady = true;
            document.getElementById('mainBtn').disabled = false;
            document.getElementById('mainBtn').innerText = "翻譯並精確標音";
            document.getElementById('status').innerText = "引擎已就緒";
        } catch (e) {
            document.getElementById('status').innerText = "引擎載入失敗，請刷新頁面";
        }
    })();

    async function processAll() {
        const text = document.getElementById('input').value.trim();
        if(!text || !isReady) return;
        
        document.getElementById('status').innerText = "正在處理中...";
        const isJpInput = /[\u3040-\u30ff]/.test(text);
        
        try {
            // 1. 取得翻譯
            const sl = isJpInput ? 'ja' : 'zh-CN', tl = isJpInput ? 'zh-CN' : 'ja';
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
            const d = await res.json();
            const transText = d[0][0][0];

            // 2. 標音處理 (不論輸入還是輸出，只要是日文就標音)
            let origHtml = text;
            let transHtml = transText;

            if (isJpInput) {
                origHtml = await kuroshiro.convert(text, { to: "hiragana", mode: "furigana" });
            } else {
                transHtml = await kuroshiro.convert(transText, { to: "hiragana", mode: "furigana" });
            }

            // 3. 渲染結果
            document.getElementById('origOut').innerHTML = `<strong>原文：</strong><br>${origHtml}`;
            document.getElementById('transOut').innerHTML = `<strong>譯文：</strong><br>${transHtml}`;
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('status').innerText = "完成";
            
        } catch (e) {
            alert("處理出錯，請稍後再試");
            document.getElementById('status').innerText = "錯誤";
        }
    }
</script>
</body>
</html>
